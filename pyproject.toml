[project]
name = "daon-market-lab"
version = "0.1.0"
description = "「해킹 서바이벌 가이드」 다온마켓 랩 도구(재연·확인·수업 이동·점수판)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "normal: 정상 요청·오탐 확인 시험. 수업 시작 지점에서도 그린이어야 한다",
]
addopts = "-q -p no:cacheprovider"
