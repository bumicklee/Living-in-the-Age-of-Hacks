version: '3'
services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} #root 계정 비밀번호 설정
    ports:
      - 3306:3306
    volumes:
      - /mydata/mysql/data:/var/lib/mysql #데이터 파일 디렉터리 마운트
      - /mydata/mysql/conf:/etc/mysql #설정 파일 디렉터리 마운트
      - /mydata/mysql/log:/var/log/mysql #로그 파일 디렉터리 마운트
  redis:
    image: redis:7
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - /mydata/redis/data:/data #데이터 파일 디렉터리 마운트
    ports:
      - 6379:6379
  nginx:
    image: nginx:1.22
    container_name: nginx
    volumes:
      - /mydata/nginx/conf:/etc/nginx #설정 파일 디렉터리 마운트
      - /mydata/nginx/html:/usr/share/nginx/html #정적 리소스 루트 디렉터리 마운트
      - /mydata/nginx/logs:/var/log/nginx #로그 파일 디렉터리 마운트
    ports:
      - 80:80
  rabbitmq:
    image: rabbitmq:3.9.11-management
    container_name: rabbitmq
    volumes:
      - /mydata/rabbitmq/data:/var/lib/rabbitmq #데이터 파일 디렉터리 마운트
    ports:
      - 5672:5672
      - 15672:15672
  elasticsearch:
    image: elasticsearch:7.17.3
    container_name: elasticsearch
    environment:
      - "cluster.name=elasticsearch" #클러스터 이름을 다음으로 설정elasticsearch
      - "discovery.type=single-node" #단일 노드 모드로 시작
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m" #es가 사용할 jvm 메모리 크기 설정
    volumes:
      - /mydata/elasticsearch/plugins:/usr/share/elasticsearch/plugins #플러그인 파일 디렉터리 마운트
      - /mydata/elasticsearch/data:/usr/share/elasticsearch/data #데이터 파일 디렉터리 마운트
    ports:
      - 9200:9200
      - 9300:9300
  logstash:
    image: logstash:7.17.3
    container_name: logstash
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /mydata/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf #설정 파일 마운트
    depends_on:
      - elasticsearch #kibanaelasticsearch가 시작된 후에 시작
    links:
      - elasticsearch:es #es 도메인으로 elasticsearch 서비스에 접근 가능
    ports:
      - 4560:4560
      - 4561:4561
      - 4562:4562
      - 4563:4563
  kibana:
    image: kibana:7.17.3
    container_name: kibana
    links:
      - elasticsearch:es #es 도메인으로 elasticsearch 서비스에 접근 가능
    depends_on:
      - elasticsearch #kibanaelasticsearch가 시작된 후에 시작
    environment:
      - "elasticsearch.hosts=http://es:9200" #elasticsearch 접속 주소 설정
    ports:
      - 5601:5601
  mongo:
    image: mongo:4
    container_name: mongo
    volumes:
      - /mydata/mongo/db:/data/db #데이터 파일 디렉터리 마운트
    ports:
      - 27017:27017
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001" #데이터 디렉터리와 console 실행 포트를 지정해 시작
    volumes:
      - /mydata/minio/data:/data #데이터 디렉터리 마운트
    environment:
      - "MINIO_ROOT_USER=minioadmin"
      - "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}"
    ports:
      - 9090:9000
      - 9001:9001
