version: '3'
services:
  mall-admin:
    image: mall/mall-admin:1.0-SNAPSHOT
    container_name: mall-admin
    ports:
      - 8080:8080
    volumes:
      - /mydata/app/mall-admin/logs:/var/logs
      - /etc/localtime:/etc/localtime
    environment:
      - 'TZ="Asia/Shanghai"'
    external_links:
      - mysql:db #db 도메인으로 mysql 서비스에 접근 가능
  mall-search:
    image: mall/mall-search:1.0-SNAPSHOT
    container_name: mall-search
    ports:
      - 8081:8081
    volumes:
      - /mydata/app/mall-search/logs:/var/logs
      - /etc/localtime:/etc/localtime
    environment:
      - 'TZ="Asia/Shanghai"'
    external_links:
      - elasticsearch:es #es 도메인으로 elasticsearch 서비스에 접근 가능
      - mysql:db #db 도메인으로 mysql 서비스에 접근 가능
  mall-portal:
    image: mall/mall-portal:1.0-SNAPSHOT
    container_name: mall-portal
    ports:
      - 8085:8085
    volumes:
      - /mydata/app/mall-portal/logs:/var/logs
      - /etc/localtime:/etc/localtime
    environment:
      - 'TZ="Asia/Shanghai"'
    external_links:
      - redis:redis #redis 도메인으로 redis 서비스에 접근 가능
      - mongo:mongo #mongo 도메인으로 mongo 서비스에 접근 가능
      - mysql:db #db 도메인으로 mysql 서비스에 접근 가능
      - rabbitmq:rabbit #rabbit 도메인으로 rabbitmq 서비스에 접근 가능