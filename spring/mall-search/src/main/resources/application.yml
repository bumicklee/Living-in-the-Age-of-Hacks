spring:
  application:
    name: mall-search
  profiles:
    active: dev #기본값은 개발 환경
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8081

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

springdoc:
  swagger-ui:
    # Swagger UI 경로 변경
    path: /swagger-ui.html
    # Swagger UI 화면 활성화
    enabled: true
    # tag와 operation의 펼침 방식 설정용, 여기서는 모두 펼치지 않도록 설정
    doc-expansion: 'none'
  api-docs:
    # api-docs 경로 변경
    path: /v3/api-docs
    # 켜기api-docs
    enabled: true
  group-configs:
    - group: 'mall-search'
      packages-to-scan: com.macro.mall.search.controller



