spring:
  application:
    name: mall-portal
  profiles:
    active: dev #기본값은 개발 환경
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization #JWT저장된 요청 헤더
  secret: mall-portal-secret #JWT암복호화에 사용하는 키
  expiration: 604800 #JWT만료 시간(60*60*24*7)
  tokenHead: 'Bearer '  #JWT페이로드에서 시작 부분 가져오기

secure:
  ignored:
    urls: #보안 경로 화이트리스트
      - /swagger-ui/
      - /v3/api-docs/*
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /sso/**
      - /home/**
      - /product/**
      - /brand/**
      - /alipay/**

springdoc:
  swagger-ui:
    # Swagger UI 경로 변경
    path: /swagger-ui.html
    # Swagger UI 화면 활성화
    enabled: true
    # tag와 operation의 펼침 방식 설정용, 여기서는 모두 펼치지 않도록 설정
    doc-expansion: 'none'
  api-docs:
    # api-docs 경로 변경
    path: /v3/api-docs
    # 켜기api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 사용자 정의redis key
redis:
  database: mall
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90 # 인증 코드 만료 시간
    common: 86400 # 24시간

mongo:
  insert:
    sqlEnable: true # 데이터베이스 데이터로 삽입할지 제어용mongo

# 메시지 큐 정의
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

