# 다온마켓 외부 자원 목록 [교육용 추가, 가짜] (11-5). make audit-dns가 영역 파일(daon.example.zone)과 맞춰 본다.
# DNS 레코드가 가리켜도 되는 곳은 여기서 status: active인 자원뿐이다. 목록 담당: 플랫폼팀(목록이 틀리면 점검이 오탐을 낸다).
#
# 런북(자원을 지울 때): ① DNS 레코드를 먼저 지우는 병합 요청 → ② 병합·반영 확인 → ③ 그다음 자원을 지운다 → ④ 여기 status를 deleted로.
#   순서를 거꾸로 하면 「레코드는 남고 자원은 사라진」 사이에 남이 같은 이름의 자원을 만들어 우리 도메인 이름을 쓸 수 있다.
owner: platform-team
addresses:                 # 우리 서버 주소(A 레코드가 가리켜도 되는 곳)
  - 192.0.2.10             # 상점 부하분산기
  - 192.0.2.11             # API
  - 192.0.2.53             # 이름 서버
resources:                 # 바깥 이름(CNAME·MX가 가리키는 곳)
  - name: event2025-page
    target: daon-event2025.pages.example.
    status: deleted
    deleted_at: 2025-12-31
    note: 2025 연말 행사 페이지(외부 페이지 서비스). 계정과 페이지를 지웠다
  - name: mail-inbound
    target: mx.mailer-now.example.
    status: active
mail_senders:              # SPF include에 들어가도 되는 발송 업체
  - name: mailer-now
    spf_include: _spf.mailer-now.example
    status: active
  - name: mailer-old
    spf_include: _spf.mailer-old.example
    status: ended
    ended_at: 2025-06-30
    note: 2025-06 계약 끝. 이 업체의 발송 설정을 남이 확보하면 우리 이름으로 메일을 보낼 수 있다
