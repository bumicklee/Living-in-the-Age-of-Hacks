# 관리자 화면(admin-web) nginx 설정: 원본 이미지의 기본 설정 + 「교육용 랩」 띠(A10).
# 관리자 화면 소스를 고치지 않고, 내보내는 HTML의 </body> 앞에 띠 한 줄을 끼운다(nginx sub_filter).
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        sub_filter_once on;
        sub_filter '</body>' '<div data-testid="lab-banner" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:3px 12px;text-align:center;background:#fff4c2;color:#5c4400;border-top:1px solid #e3c55a;font:600 13px/1.5 system-ui,sans-serif;pointer-events:none">교육용 랩 · 127.0.0.1 · 값은 가짜</div></body>';
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
