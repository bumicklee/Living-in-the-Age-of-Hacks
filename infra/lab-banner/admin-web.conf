# 관리자 화면(admin-web) nginx 설정: 원본 이미지의 기본 설정 + 「교육용 랩」 띠(A10).
# 관리자 화면 소스를 고치지 않고, 내보내는 HTML의 </body> 앞에 띠 한 줄을 끼운다(nginx sub_filter).
# 다온마켓 3-5: 관리자 화면 CSP. 인라인 스크립트(글 속에 섞인 <script>, onerror= 같은 속성)를 실행하지 않는다.
# - connect-src: 관리자 화면은 관리자 API(127.0.0.1:8080)를 부른다. 포트를 바꿔도 되게 127.0.0.1:* 로 둔다
# - style-src 'unsafe-inline': 「교육용 랩」 띠·Element Plus가 인라인 스타일을 쓴다. 스타일 허용은 스크립트 허용보다 위험이 작다
# - img-src: 상품 사진은 MinIO·외부 주소 여러 곳이라 이미지 출처는 넓게 둔다(이미지는 스크립트를 실행하지 않는다)
# - report-uri: 막힌 일은 같은 출처 주소로 보고받는다(아래 location, 관리자 API /daon/csp-report로 넘긴다)
# [랩 스위치] ${SECUREKIT_HEADERS_ENABLED}는 nginx가 뜰 때 채워진다(15-daon-switches.envsh, make switch K=headers V=off면 false → 헤더 없음)
map "${SECUREKIT_HEADERS_ENABLED}" $daon_csp {
    "false"  "";
    default  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; report-uri /api/daon/csp-report";
}

server {
    listen       80;
    server_name  localhost;
    server_tokens off;   # 6-6: Server 헤더에 nginx 버전을 싣지 않는다

    # 다온마켓 3-5: 인라인 스크립트를 허용하지 않는다. 막힌 일은 보고 주소로 받는다
    location / {
        add_header Content-Security-Policy $daon_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        sub_filter_once on;
        sub_filter '</body>' '<div data-testid="lab-banner" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:3px 12px;text-align:center;background:#fff4c2;color:#5c4400;border-top:1px solid #e3c55a;font:600 13px/1.5 system-ui,sans-serif;pointer-events:none">교육용 랩 · 127.0.0.1 · 값은 가짜</div></body>';
    }

    # 다온마켓 3-5: CSP 위반 보고를 같은 출처로 받아 관리자 API로 넘긴다(브라우저가 로그인 없이 보낸다, 본문 16KB까지)
    location = /api/daon/csp-report {
        client_max_body_size 16k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $daon_admin_api http://mall-admin:8080;
        proxy_pass $daon_admin_api/daon/csp-report;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
