# 다온마켓 A5 · 보안 이벤트 경보 규칙(Grafana 경보 규칙 불러오기 형식)
# make alert-rules 가 course/SECURITY_EVENTS.md 표의 「경보 후보(8장)」 칸에서 만든다. 손으로 고치지 않는다.
# 새 이벤트는 표에 한 줄 더하고 make alert-rules 를 다시 돌린다(Grafana가 다시 뜬다).
# 손으로 쓴 규칙은 같은 폴더의 bulk.yaml(8-4)·collector.yaml(8-5), 알림 정책은 notify.yaml.
apiVersion: 1
groups:
- orgId: 1
  name: security-events
  folder: 다온마켓 경보
  interval: 30s
  rules:
  - uid: sec-access-denied-not-owner
    title: access.denied.not_owner
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum by (actor, app) (count_over_time({event="access.denied.not_owner"} | json actor="actor" [10m]))
        queryType: instant
        editorMode: code
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 4
    noDataState: OK
    execErrState: OK
    for: 0s
    labels:
      event: access.denied.not_owner
      severity: P2
      lesson: 2-2
      source: SECURITY_EVENTS.md
    annotations:
      summary: 'access.denied.not_owner: 같은 actor 10m 안 5건 이상'
      description: '경보 후보(8장): 같은 actor count ≥ 5 / 10분(번호 훑기, P2)'
      runbook_url: docs/runbooks/access.denied.not_owner.md
    isPaused: false
