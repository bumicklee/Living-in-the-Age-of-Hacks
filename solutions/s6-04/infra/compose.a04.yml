# 다온마켓 랩 · 아키텍처 A4 「키 금고」(수업 5-2, 5-3·5-4가 이어서 쓴다)
#
#   infra/arch.txt에 a04 줄이 있으면 daon 명령이 compose.yml(+ a02 · a03) 위에 이 파일을 함께 쓴다.
#
# 바뀌는 것
#   - OpenBao 1대(파일 저장소). UI는 이 PC에서만 http://127.0.0.1:8200
#   - openbao-init(한 번 돌고 끝남): 봉인 해제, transit 키 daon-jwt(ECDSA P-256, 5-2)·daon-pii(AES-GCM, 5-3),
#     KV secret/daon/pii-hmac(검색용 키, 5-4), 앱별 AppRole(daon-portal·daon-admin), 감사 로그
#   - 고객 앱·관리자 앱은 AppRole 값을 읽기 전용으로 붙이고 OpenBao 주소를 받는다
#
# 한계(수업에서 말한다)
#   - 봉인 해제 키를 랩 볼륨에 둔다(랩 전용). 회사에서는 자동 봉인 해제(KMS·HSM)나 여러 사람이 나눠 갖는다.
#   - 랩 내부 망이라 TLS를 껐다. 회사에서는 켠다.

services:
  openbao:
    profiles: [spring]
    image: openbao/openbao:2.4.1
    command: ["server", "-config=/openbao/config/config.hcl"]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - bao-data:/openbao/file
      - bao-logs:/openbao/logs
    ports: ["${DAON_BIND:-127.0.0.1}:${DAON_OPENBAO_PORT:-8200}:8200"]
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1; rc=$$?; [ $$rc -eq 0 ] || [ $$rc -eq 2 ]"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    networks: [daon]

  openbao-init:
    profiles: [spring]
    image: openbao/openbao:2.4.1
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      DAON_BAO_DB_PASSWORD: ${DAON_BAO_DB_PASSWORD:?infra/.env에 DAON_BAO_DB_PASSWORD가 없습니다(.env.example 참고)}
      DAON_DRUID_PASSWORD: ${DAON_DRUID_PASSWORD_VAULT:?infra/.env에 DAON_DRUID_PASSWORD_VAULT가 없습니다(.env.example 참고)}
      DAON_CACHE_HMAC_KEY: ${DAON_CACHE_HMAC_KEY:?infra/.env에 DAON_CACHE_HMAC_KEY가 없습니다(.env.example 참고)}
      # 10-4: 결제 웹훅 서명 비밀(랩 전용 가짜 값, 가짜 결제사 payment-stub과 같은 값). 앱은 KV secret/daon/payment-webhook에서 읽는다
      DAON_PAYMENT_WEBHOOK_SECRET: ${DAON_PAYMENT_WEBHOOK_SECRET:-lab-fake-webhook-secret}
      # 6-4: 저장소 앱 계정의 비밀. 앱이 시작할 때 KV(secret/daon/portal·admin)에서 받는다
      DAON_MONGO_APP_PASSWORD: ${DAON_MONGO_APP_PASSWORD:?infra/.env에 DAON_MONGO_APP_PASSWORD가 없습니다(.env.example 참고)}
      DAON_RABBIT_APP_PASSWORD: ${DAON_RABBIT_APP_PASSWORD:?infra/.env에 DAON_RABBIT_APP_PASSWORD가 없습니다(.env.example 참고)}
      DAON_MINIO_APP_ACCESS_KEY: ${DAON_MINIO_APP_ACCESS_KEY:?infra/.env에 DAON_MINIO_APP_ACCESS_KEY가 없습니다(.env.example 참고)}
      DAON_MINIO_APP_SECRET_KEY: ${DAON_MINIO_APP_SECRET_KEY:?infra/.env에 DAON_MINIO_APP_SECRET_KEY가 없습니다(.env.example 참고)}
    volumes:
      - ./openbao/init.sh:/init.sh:ro
      - bao-lab:/bao-lab
      - bao-creds:/bao-creds
    depends_on:
      openbao: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 64m
    networks: [daon]

  # 6-3: MySQL 준비 한 번(멱등). 고정 계정 reader를 지우고, 시크릿 저장소가 동적 계정을 만들 때 쓰는 계정(openbao)을 둔다.
  #      openbao 계정은 계정 만들기 권한과 mall 표 권한(나눠 줄 수 있는 만큼)만 가진다. 앱은 이 계정을 쓰지 않는다.
  db-init:
    profiles: [spring]
    image: mysql:8.4.13
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mysql -h db -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done
        mysql -h db -uroot -proot <<SQL
        DROP USER IF EXISTS 'reader'@'%';
        CREATE USER IF NOT EXISTS 'openbao'@'%' IDENTIFIED BY '$${DAON_BAO_DB_PASSWORD}';
        ALTER USER 'openbao'@'%' IDENTIFIED BY '$${DAON_BAO_DB_PASSWORD}';
        GRANT CREATE USER ON *.* TO 'openbao'@'%';
        GRANT SELECT, INSERT, UPDATE, DELETE ON mall.* TO 'openbao'@'%' WITH GRANT OPTION;
        GRANT CREATE, ALTER, INDEX ON mall.* TO 'openbao'@'%' WITH GRANT OPTION;
        FLUSH PRIVILEGES;
        SQL
        echo "[6-3] DB 준비: reader 삭제, openbao 계정 확인"
    environment:
      DAON_BAO_DB_PASSWORD: ${DAON_BAO_DB_PASSWORD:?infra/.env에 DAON_BAO_DB_PASSWORD가 없습니다(.env.example 참고)}
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"
    mem_limit: 128m
    networks: [daon]

  mall-portal:
    environment:
      DAON_OPENBAO_ADDR: http://openbao:8200
      DAON_OPENBAO_ROLE: portal
    volumes:
      - bao-creds:/run/openbao:ro
    depends_on:
      openbao-init: { condition: service_completed_successfully }

  mall-admin:
    environment:
      DAON_OPENBAO_ADDR: http://openbao:8200
      DAON_OPENBAO_ROLE: admin
    volumes:
      - bao-creds:/run/openbao:ro
    depends_on:
      openbao-init: { condition: service_completed_successfully }

volumes:
  bao-data: {}
  bao-logs: {}
  bao-lab: {}
  bao-creds: {}
