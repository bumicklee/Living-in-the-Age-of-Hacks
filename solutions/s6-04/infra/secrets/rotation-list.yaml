# 교체 대상 목록(값은 적지 않는다: 이름·위치·상태만). 6-2에서 찾은 시크릿은 지우는 것으로 끝나지 않는다.
# git 이력·이미지·복제본에 남은 값은 회수되지 않으므로 「교체」가 답이다. status: pending → rotated(교체 완료).
# lesson 칸은 그 항목을 교체하는 수업이다(6-3: 앱 쪽 시크릿, 6-4: 저장소 서버 쪽 계정).
- id: db-reader
  what: 앱이 쓰던 DB 고정 계정(이름은 reader, 권한은 mall 전체)
  where: spring/*/application-*.yml 의 spring.datasource, infra/mysql/init/00-users.sql
  lesson: "6-3"
  status: rotated   # 6-3: 고정 계정을 없애고 시크릿 저장소에서 받는다
- id: druid-console
  what: 모니터링 화면(/druid) 로그인 비밀번호
  where: spring/*/application-*.yml 의 login-password
  lesson: "6-3"
  status: rotated   # 6-3: 고정 계정을 없애고 시크릿 저장소에서 받는다
- id: jwt-signing
  what: 토큰 서명 키(원본 데모 고정 문자열)
  where: 5-2에서 금고(OpenBao transit)로 옮김
  lesson: "5-2"
  status: rotated
- id: postman-tokens
  what: Postman 컬렉션 속 로그인 토큰 5개(옛 서명 키로 만든 것)
  where: spring/document/postman/mall-admin.postman_collection.json
  lesson: "6-2"
  status: rotated   # 서명 키가 바뀌어 옛 토큰은 무효. 자리에는 미끼(canary) 표시를 남겼다
- id: rabbitmq-app
  what: 메시지 큐 앱 계정 mall(원본 데모 기본값)
  where: spring/*/application-*.yml, infra/compose.yml
  lesson: "6-4"
  status: rotated   # 6-4: 기본 계정(guest·mall)을 지우고 앱 전용 계정으로. 비밀번호는 시크릿 저장소(OpenBao KV)에서 받는다
- id: minio-root
  what: 파일 창고 관리자 계정(원본 데모 기본값)
  where: spring/mall-admin/application-*.yml, infra/compose.yml
  lesson: "6-4"
  status: rotated   # 6-4: 루트 계정을 .env의 값으로 교체, 앱은 전용 접근 키(버킷 mall만)를 시크릿 저장소에서 받는다
