spring:
  application:
    name: mall-admin
  profiles:
    active: dev #기본값은 개발 환경
  servlet:
    multipart:
      enabled: true #파일 업로드 활성화
      max-file-size: 5MB # 다온마켓 3-6: 멀티파트에서 먼저 자른다(코드 상한 2MB는 MinioController·UploadValidator)
      max-request-size: 6MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

# ✏️ 6-6: 아래 daon 아래에 daon.cors.allowed-origins(허용 출처 목록)를 더한다
daon:
  jwt:
    audience: daon-admin #5-2: 토큰을 받는 대상(회원 앱과 관리자 앱이 서로의 토큰을 못 쓰게)

jwt:
  tokenHeader: Authorization #JWT저장된 요청 헤더
  # ✏️ 5-2: jwt.secret 설정을 지웠다. 서명 키는 금고(OpenBao)에 있고 앱은 공개키로 확인만 한다
  expiration: 604800 #JWT만료 시간(60*60*24*7) ✏️ 4-8: 토큰 하나가 7일 동안 통한다(다온마켓 교육용 표시)
  tokenHead: 'Bearer '  #JWT페이로드에서 시작 부분 가져오기

redis:
  database: mall
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
  expire:
    common: 86400 # 24시간

management:                        # 6-5: 관리용 엔드포인트는 별도 포트(8081)로. compose는 이 포트를 PC에 열지 않는다(컨테이너 안·같은 망에서만)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health                # 노출 목록은 health 하나(설정 한 줄이 바뀌어도 env·heapdump가 열리지 않게)
  endpoint:
    health:
      show-details: never

secure:
  ignored:
    urls: #보안 경로 화이트리스트
      - /swagger-ui/
      - /v3/api-docs/*
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
      # 다온마켓 3-6: /minio/upload·/aliyun/oss/policy를 뺐다. 이제 로그인과 권한표(상품 관리 권한)를 거친다
      - /ops/** # [교육용 추가] 다온 운영 도구(8095 포트 전용, 2-6). 로컬 도구라 로그인 없이 연다
      - /daon/csp-report # 다온마켓 3-5: CSP 위반 보고. 브라우저가 로그인 없이 보낸다(본문 크기 상한은 컨트롤러가 본다)

springdoc:
  swagger-ui:
    # Swagger UI 경로 변경
    path: /swagger-ui.html
    # Swagger UI 화면 활성화
    enabled: true
    # tag와 operation의 펼침 방식 설정용, 여기서는 모두 펼치지 않도록 설정
    doc-expansion: 'none'
  api-docs:
    # api-docs 경로 변경
    path: /v3/api-docs
    # 켜기api-docs
    enabled: true
  group-configs:
    - group: 'default'
      packages-to-scan: com.macro.mall.controller
  default-flat-param-object: false

aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com # oss외부 서비스 접근 도메인
    accessKeyId: test # 접근 인증에 사용되는 사용자 식별자
    accessKeySecret: ${DAON_OSS_TOKEN:not-used-in-lab}  # 사용자가 서명 문자열을 암호화하고 oss가 서명 문자열을 검증하는 데 쓰는 키
    bucketName: macro-oss # oss저장 공간
    policy:
      expire: 300 # 서명 유효 기간(S)
    maxSize: 10 # 업로드 파일 크기(M)
    callback: http://localhost:8080/aliyun/oss/callback # 파일 업로드 성공 후 콜백 주소
    dir:
      prefix: mall/images/ # 업로드 폴더 경로 접두사
