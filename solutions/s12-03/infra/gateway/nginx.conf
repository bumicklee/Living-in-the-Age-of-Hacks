# 다온마켓 랩 · 게이트웨이(아키텍처 A1, 수업 6-4 · A7, 수업 11-3). PC로 나가는 입구는 여기서 정리한다.
#   9000  파일(상품 사진) 주소. 버킷 mall의 읽기(GET·HEAD)와 상태 확인만 MinIO로 넘기고 나머지는 거절한다
#   8443  관리자 입구. 관리자 화면(admin-web)과 RabbitMQ 관리 화면(/rabbitmq/)만. 랩 내부라 TLS를 껐다(회사에서는 켠다)
#   8086  고객 API 입구(A7, 11-3). /api/ → Varnish(캐시, 11-4) → mall-portal. 요청의 끝을 모호하게 적은 요청은 여기서 400으로 끊는다
#   8087  파트너 입구(A9, 12-2). /partner/ → mall-portal(캐시를 거치지 않음). 고객 입구(8086·8088)에서 /partner/는 404
#         12-3부터 https + 클라이언트 인증서(랩 내부 CA). 확인한 인증서만 X-Daon-Client-Cert로 앱에 넘긴다
# 모든 요청에 추적 번호($request_id)를 붙여 접근 로그에 남기고, 뒤 서버에도 X-Request-Id로 넘긴다(앱 로그와 한 번호로 이어진다).
# 접근 로그에는 쿼리 문자열을 싣지 않는다(주소에 토큰이 실려도 로그에 남지 않게).

log_format daon_json escape=json
  '{"ts":"$time_iso8601","trace_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"upstream":"$upstream_addr","rt":$request_time}';
access_log /dev/stdout daon_json;

resolver 127.0.0.11 valid=10s ipv6=off;       # 도커 내장 DNS: 뒤 서버가 늦게 떠도 게이트웨이는 먼저 뜬다
server_tokens off;

# ───────────── A7(11-3): 요청 경계가 모호한 요청 거절 ─────────────
# 앞단(게이트웨이)과 뒷단(Varnish·앱)이 「요청이 어디서 끝나는지」를 같게 보게 한다.
#   ① nginx 자체(1.21.1부터)가 이미 거절하는 것: Content-Length와 Transfer-Encoding이 함께 온 요청, Content-Length 두 줄,
#      헤더 이름에 공백·제어 문자(접힌 헤더 줄 포함), HTTP/1.0 요청의 Transfer-Encoding(1.21.2). 버전을 고정해 이 동작을 지킨다
#   ② 아래 표는 같은 규칙을 설정에도 적어 둔 두 번째 겹이다(버전이 바뀌어도 규칙이 설정 파일에 보이게)
#   ③ 본문은 앞단이 끝까지 받은 뒤 길이를 다시 정해 넘긴다(proxy_request_buffering on, 기본값). 뒷단 연결은 요청마다 새로(재사용 끔)
map "$http_content_length|$http_transfer_encoding" $daon_two_lengths {
    default      0;
    "~^.+\|.+$"  1;      # 길이 표시가 둘
}
map $http_transfer_encoding $daon_bad_te {
    default   1;         # chunked가 아닌 값(목록·다른 이름·대소문자 바꿈)은 거절
    ""        0;
    "chunked" 0;
}
# 게이트웨이가 스스로 끊은 요청(뒤 서버에 가지 않음 = upstream_addr 비어 있음)
map "$status|$upstream_addr" $daon_gw_reject {
    default           0;
    "~^(400|501)\|$"  1;
}
# 이벤트 칸 정리: 경로는 영문·숫자·/._- 만 120자, UA는 120자(앱의 SecurityEventLogger와 같은 기준)
map $uri $daon_path {
    default                        "-";
    "~^(?<p>[A-Za-z0-9/._-]{1,120})" $p;
}
map $http_user_agent $daon_ua {
    default             "";
    "~^(?<u>.{1,120})"  $u;
}
# 보안 이벤트 한 줄(앱 SECURITY 줄과 같은 키). 수집기(A5)는 「WARN SECURITY {…}」 모양을 stream=security로 모은다
log_format daon_sec_malformed escape=json
  'WARN SECURITY {"event":"request.denied.malformed","lesson":"11-3","actor":"anonymous","target":"path:$daon_path",'
  '"ip":"$remote_addr","ua":"$daon_ua","reason":"게이트웨이에서 요청 경계가 모호해 거부(HTTP $status)","count":1,'
  '"ts":"$time_iso8601","trace_id":"$request_id"}';

# ───────────── A7(11-4): 인증 요청에 캐시 적중 ─────────────
# 로그인한 요청(Authorization 있음)인데 Varnish가 캐시에서 답했다(X-Cache: HIT) = 남의 응답이 나갔을 수 있다.
# 11-4 뒤 정상 운영에서는 0이어야 한다. 배포 직후 캐시 설정이 바뀌는 사고를 잡는 신호(한 번이라도 경보)
map "$upstream_http_x_cache|$http_authorization" $daon_auth_hit {
    default       0;
    "~^HIT\|.+"   1;
}
log_format daon_sec_cache_hit escape=json
  'WARN SECURITY {"event":"cache.hit.authenticated","lesson":"11-4","actor":"anonymous","target":"path:$daon_path",'
  '"ip":"$remote_addr","ua":"$daon_ua","reason":"인증 요청에 캐시 적중","count":1,'
  '"ts":"$time_iso8601","trace_id":"$request_id"}';

server {
    listen 9000;
    server_name _;
    set $minio http://minio:9000;
    add_header X-Request-Id $request_id always;

    location = /minio/health/live {
        proxy_pass $minio;
    }

    location /mall/ {
        limit_except GET HEAD { deny all; }       # 올리기·지우기는 앱이 안쪽 주소로 한다. PC로 열린 주소는 읽기만
        proxy_pass $minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443;
    server_name _;
    set $admin_web http://admin-web:80;
    set $rabbit_ui http://rabbit:15672;
    add_header X-Request-Id $request_id always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /rabbitmq/ {
        proxy_pass $rabbit_ui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass $admin_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    # 고객 API 입구(A7). 고객 웹(8088)은 지금처럼 앱을 직접 부른다(바꾸지 않음). 이 입구가 「A7 경로」다
    listen 8086;
    server_name _;
    set $varnish http://varnish:6081;
    add_header X-Request-Id $request_id always;
    access_log /dev/stdout daon_json;
    access_log /dev/stdout daon_sec_malformed if=$daon_gw_reject;
    access_log /dev/stdout daon_sec_cache_hit if=$daon_auth_hit;   # 11-4

    client_max_body_size 1m;             # 9-3 앱 상한과 같게: 앞단에서 먼저 끊는다
    ignore_invalid_headers on;           # 기본값. 이름이 이상한 헤더는 뒤로 넘기지 않는다
    underscores_in_headers off;          # 기본값. X_Forwarded_For 같은 이름을 앱이 다르게 읽지 않게

    if ($daon_two_lengths) { return 400; }
    if ($daon_bad_te)      { return 400; }

    # 12-2(A9): 파트너 경로는 고객 입구로 받지 않는다(파트너 입구 8087로만). 앱도 파트너 입구에서 온 요청만 받는다(PartnerEntrance)
    location /api/partner/ {
        return 404;
    }

    location /api/ {
        proxy_pass $varnish;
        proxy_http_version 1.1;
        proxy_request_buffering on;          # 기본값. 끄면 앞단이 다 받기 전에 뒷단으로 흘려보낸다(경계 해석을 뒷단에 맡김)
        proxy_set_header Connection "close"; # 뒷단 연결 재사용 끔(1.29.7부터 nginx 기본은 재사용). 한 연결을 여러 사용자가 나눠 쓰지 않게
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}

# ───────────── A9(12-3): 파트너 클라이언트 인증서 ─────────────
# 게이트웨이가 랩 내부 CA로 확인한 인증서(SUCCESS)만 넘긴다. 확인 실패(FAILED:…)·인증서 없음(NONE)이면 빈 값 = 헤더를 넘기지 않는다.
# 밖에서 같은 이름의 헤더를 넣어 와도 proxy_set_header가 이 값으로 덮어쓴다(빈 값이면 지운다). 이 줄이 빠지면 누구나 지문을 꾸민다
map $ssl_client_verify $daon_client_cert {
    default   "";
    "SUCCESS" $ssl_client_escaped_cert;
}

server {
    # 파트너 입구(A9, 12-2). 고객 입구와 다른 포트·다른 서버 블록. /partner/ 만 mall-portal로 넘긴다(캐시 없음)
    # 앱은 소켓 주소가 이 게이트웨이일 때만 파트너 요청을 받는다(PartnerEntrance). 그래서 이 입구를 지나지 않은 파트너 요청은 404
    listen 8087 ssl;
    server_name _;
    set $portal http://mall-portal:8085;

    # ✏️ 12-3: mTLS. 서버 인증서(127.0.0.1·localhost)와 클라이언트 확인용 CA는 partner-pki가 만든다(infra/openbao/partner-pki.sh)
    ssl_certificate         /etc/daon-pki/gateway.crt;
    ssl_certificate_key     /etc/daon-pki/gateway.key;
    ssl_client_certificate  /etc/daon-pki/ca.crt;
    ssl_verify_client       optional;      # on이면 인증서 없는 요청을 nginx가 400으로 끊는다. optional로 두고 「토큰과 같은 인증서인가」는 앱이 401로 답한다
    ssl_verify_depth        1;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_session_cache       shared:daon_partner:1m;
    add_header X-Request-Id $request_id always;
    access_log /dev/stdout daon_json;

    client_max_body_size 64k;            # 파트너 API는 작은 폼(토큰 발급·회전)만 받는다
    ignore_invalid_headers on;
    underscores_in_headers off;

    if ($daon_two_lengths) { return 400; }
    if ($daon_bad_te)      { return 400; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /partner/ {
        proxy_pass $portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Daon-Client-Cert $daon_client_cert;   # ✏️ 12-3: 확인한 인증서(URL 인코딩 PEM)만. 밖에서 온 값은 늘 덮어쓴다
    }

    location / {
        return 404;
    }
}
