server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://db:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DAON_DB_USER}
    password: ${DAON_DB_PASSWORD}
    druid:
      initial-size: 5 #커넥션 풀 초기 크기
      min-idle: 10 #최소 유휴 연결 수
      max-active: 20 #최대 연결 수
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #이 요청 데이터는 집계하지 않음
      stat-view-servlet: #모니터링 웹 페이지 접속용 로그인 사용자 이름과 비밀번호
        login-username: druid
        login-password: ${DAON_DRUID_PASSWORD}
  data:
    mongodb:
      host: mongo
      port: 27017
      database: mall-port
    redis:
      host: redis # Redis서버 주소
      database: 0 # Redis데이터베이스 인덱스(기본값 0)
      port: 6379 # Redis서버 접속 포트
      password: # Redis서버 접속 비밀번호(기본값 비어 있음)
      timeout: 300ms # 연결 타임아웃(밀리초)
  rabbitmq:
    host: rabbit
    port: 5672
    virtual-host: /mall
    username: mall
    password: ${DAON_RABBIT_PASSWORD}

mongo:
  insert:
    sqlEnable: true # 데이터베이스 데이터로 삽입할지 제어용mongo

logging:
  file:
    path: /var/logs
  level:
    root: info
    com.macro.mall: info

logstash:
  host: logstash

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: your appId
  alipayPublicKey: your alipayPublicKey
  appPrivateKey: your appPrivateKey
  returnUrl: http://192.168.3.101:8060/#/pages/money/paySuccess
  notifyUrl:

