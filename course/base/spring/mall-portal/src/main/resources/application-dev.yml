server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root # ✏️ 6-2: DB 계정 이름도 설정 파일 밖으로
    password: root # ✏️ 6-2: DB 비밀번호를 설정 파일에서 뺀다
    druid:
      initial-size: 5 #커넥션 풀 초기 크기
      min-idle: 10 #최소 유휴 연결 수
      max-active: 20 #최대 연결 수
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #이 요청 데이터는 집계하지 않음
      stat-view-servlet: #모니터링 웹 페이지 접속용 로그인 사용자 이름과 비밀번호
        login-username: druid
        login-password: druid # ✏️ 6-2: 모니터링 화면 비밀번호를 설정 파일에서 뺀다
  data:
    mongodb:
      host: localhost
      port: 27017
      database: mall-port
      # ✏️ 6-4: MongoDB 인증을 켜면 앱 전용 계정(username·authentication-database)이 필요하다. 비밀번호는 시크릿 저장소에서 받는다
    redis:
      host: localhost # Redis서버 주소
      database: 0 # Redis데이터베이스 인덱스(기본값 0)
      port: 6379 # Redis서버 접속 포트
      password: # Redis서버 접속 비밀번호(기본값 비어 있음)
      timeout: 300ms # 연결 타임아웃(밀리초)
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /mall
    username: mall
    password: mall # ✏️ 6-2: 메시지 큐 비밀번호를 설정 파일에서 뺀다 # ✏️ 6-4: 계정 이름도 앱 전용(daon-portal)으로, 비밀번호는 시크릿 저장소에서

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: localhost
  enableInnerLog: false

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: your appId
  alipayPublicKey: your alipayPublicKey
  appPrivateKey: your appPrivateKey
  returnUrl: http://localhost:5173/#/pages/money/paySuccess
  notifyUrl:

