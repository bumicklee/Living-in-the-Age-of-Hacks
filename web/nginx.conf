# 다온마켓 고객 웹(A7). 정적 파일 + /api/ → mall-portal(고객 API). 같은 주소에서 부르므로 CORS 설정이 필요 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;   # 6-6: Server 헤더에 nginx 버전을 싣지 않는다

    # mall-portal이 늦게 떠도 nginx가 먼저 뜰 수 있게 이름을 요청 때 찾는다(도커 내장 DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal http://mall-portal:8085;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portal;
        # 브라우저가 보낸 Host를 포트까지 그대로 넘긴다($host는 포트를 뗀다). 4-5 재설정 링크가 이 값을 믿는지가 수업 거리다
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 주소(/login, /orders/9001 …)는 모두 index.html이 그린다
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
