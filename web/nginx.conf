# 다온마켓 고객 웹(A7). 정적 파일 + /api/ → mall-portal(고객 API). 같은 주소에서 부르므로 CORS 설정이 필요 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # mall-portal이 늦게 떠도 nginx가 먼저 뜰 수 있게 이름을 요청 때 찾는다(도커 내장 DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal http://mall-portal:8085;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 주소(/login, /orders/9001 …)는 모두 index.html이 그린다
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
